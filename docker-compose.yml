# Local stack: postgres, one-shot migrate and seed jobs, the api, the web app (nginx), and Grafana LGTM.
# Branding (PROGRAM_NAME, ORG_NAME) comes from apps/api/.env — copy it from .env.example first.
name: feedback-portal

x-api-image: &api-image
  image: feedback-portal-api
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  init: true
  env_file:
    - path: apps/api/.env
      required: false
  # Overrides what differs inside a container from local `pnpm dev`.
  environment: &api-environment
    NODE_ENV: production
    LOG_FORMAT: json
    DATABASE_URL: postgres://feedback:feedback@postgres:5432/feedback_portal

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      # Local-only credentials; must match DATABASE_URL in apps/api/.env.
      POSTGRES_USER: feedback
      POSTGRES_PASSWORD: feedback
      POSTGRES_DB: feedback_portal
    ports:
      - '5433:5432' # 5433 on the host avoids clashing with a local Postgres on 5432
    volumes:
      # Postgres 18 images keep PGDATA under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U feedback -d feedback_portal']
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies pending migrations, then exits. Re-running is a no-op.
  migrate:
    <<: *api-image
    command: ['node', 'src/shared/db/migrate.cli.ts']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  # Creates the first admin from BOOTSTRAP_ADMIN_EMAIL (apps/api/.env) when no active admin
  # exists, then exits. Does nothing when an active admin exists or the variable isn't set.
  seed:
    <<: *api-image
    command: ['node', 'src/modules/identity/bootstrap-admin.cli.ts']
    restart: 'no'
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *api-image
    environment:
      <<: *api-environment
      HOST: 0.0.0.0
      PORT: 3000
      # Sessions record the browser's address from nginx's X-Real-IP.
      TRUST_PROXY: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_METRIC_EXPORT_INTERVAL: 10000
    ports:
      - '3000:3000' # same port as `pnpm dev` — run one or the other
    depends_on:
      seed:
        condition: service_completed_successfully
      otel-lgtm:
        condition: service_healthy
    healthcheck:
      # Liveness only: /health is neither logged nor traced, so frequent probes stay silent.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  # The production build behind nginx, which forwards /api to the api and /otlp to the collector.
  web:
    image: feedback-portal-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_OTEL_TRACES_URL: /otlp/v1/traces
    environment:
      OTLP_UPSTREAM: otel-lgtm:4318
    ports:
      - '5173:8080' # the api's default WEB_APP_URL; same port as `pnpm dev:web`, run one or the other
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # OTel Collector + Tempo (traces) + Loki (logs) + Mimir (metrics) + Grafana in one container.
  # Telemetry is throwaway local data: no volume, so it resets on `docker compose down`.
  otel-lgtm:
    image: grafana/otel-lgtm:0.36.0
    ports:
      - '3001:3000' # Grafana UI (3000 is the api); local-only anonymous admin
      - '4318:4318' # OTLP/HTTP, so `pnpm dev` on the host can export here too
    healthcheck:
      test: ['CMD', '/otel-lgtm/docker/healthcheck.sh']
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  postgres-data:
