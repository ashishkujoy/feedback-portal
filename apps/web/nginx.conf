# The web app's origin: static files, plus the api and the trace collector behind it.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  # The api stays at its root: the trailing slash strips /api, as the Vite proxy does. Host and
  # Origin pass through as the browser sent them, so CSRF checks and redirects see this origin.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $http_host;
  }

  # Browser traces (OTLP/HTTP) to the collector, without CORS or exposing its port to the page.
  location /otlp/ {
    client_max_body_size 1m;
    proxy_pass http://otel-lgtm:4318/;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed file names: a new build gets new names.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # A missing file (e.g. /favicon.ico) is a 404, not the app's HTML. Routes have no extension.
  location ~ \.[A-Za-z0-9]+$ {
    try_files $uri =404;
  }

  # Client-side routes (/batches, /login?error=…) all get index.html, which is always revalidated.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
