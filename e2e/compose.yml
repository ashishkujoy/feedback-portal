# End-to-end stack: the production stack (deploy/compose.yml) with what tests need on top.
# `pnpm e2e` (e2e/run.sh) runs `docker compose -f deploy/compose.yml -f e2e/compose.yml` with the
# settings in e2e/e2e.env, then removes it all. Paths here are relative to deploy/, the first file.
# Its own project, network and throwaway database, and no host ports: it never touches another
# stack's data, and both can run at once.
name: feedback-portal-e2e

services:
  postgres:
    # Fresh on every run.
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql

  # Never a real deploy/.env (photos, telemetry): only the settings in e2e/e2e.env.
  migrate:
    env_file: !reset []

  seed:
    env_file: !reset []
    environment:
      BOOTSTRAP_ADMIN_EMAIL: admin@e2e.test
      BOOTSTRAP_ADMIN_NAME: Ada Admin

  # Google's endpoints are the stand-in's; the browser reaches it by its service name.
  api:
    env_file: !reset []
    environment:
      GOOGLE_AUTHORIZATION_URL: http://fake-google:4000/authorize
      GOOGLE_TOKEN_URL: http://fake-google:4000/token
    depends_on:
      fake-google:
        condition: service_healthy

  web:
    ports: !reset []

  # Google's sign-in and token endpoints, for test accounts only.
  fake-google:
    image: feedback-portal-e2e-fake-google
    build:
      context: ../e2e/fake-google
      dockerfile_inline: |
        FROM node:24.22.0-alpine3.24
        WORKDIR /app
        COPY server.ts .
        USER node
        CMD ["node", "server.ts"]
    environment:
      CLIENT_ID: ${GOOGLE_CLIENT_ID}
      CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      REDIRECT_URI: ${PUBLIC_URL}/api/auth/google/callback
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:4000/health || exit 1']
      interval: 2s
      timeout: 3s
      retries: 30

  playwright:
    image: feedback-portal-e2e-playwright
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    # The web container's network: the app is http://localhost:8080, as for a person, so the
    # production cookie (Secure) works over plain http.
    network_mode: service:web
    ipc: host
    init: true
    environment:
      CI: '1'
    volumes:
      - ../e2e/test-results:/app/e2e/test-results
      - ../e2e/playwright-report:/app/e2e/playwright-report
    depends_on:
      web:
        condition: service_healthy
